x-app: &app
  image: ai-document-insight:local
  build:
    context: .
    target: runtime
  environment: &environment
    OLLAMA_BASE_URL: http://ollama:11434
    REDIS_URL: redis://redis:6379/0
    EMBEDDING_CACHE_TTL: ${EMBEDDING_CACHE_TTL:-604800}
  volumes:
    - app_logs:/app/app_logging/logs

services:
  redis:
    image: redis:8.2-alpine
    ports:
      - "127.0.0.1:6379:6379"
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 2s
      retries: 5

  ollama:
    image: ollama/ollama:0.34.2
    environment:
      OLLAMA_CONTEXT_LENGTH: 8192
    volumes:
      - ${OLLAMA_MODELS_STORAGE:-ollama_models}:/root/.ollama/models
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  setup:
    <<: *app
    command: ["python", "-m", "deployment.bootstrap"]
    volumes:
      - document_data:/app/data
      - app_logs:/app/app_logging/logs
    depends_on:
      ollama:
        condition: service_healthy
      redis:
        condition: service_healthy

  api:
    <<: *app
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    volumes:
      - document_data:/app/data
      - app_logs:/app/app_logging/logs
    depends_on:
      setup:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  ui:
    <<: *app
    environment:
      <<: *environment
      API_BASE_URL: http://api:8000
    command: ["python", "-m", "streamlit", "run", "app.py", "--server.address=0.0.0.0", "--server.port=8501", "--server.headless=true"]
    ports:
      - "127.0.0.1:${UI_PORT:-8501}:8501"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8501/_stcore/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  monitoring:
    <<: *app
    command: ["python", "-m", "streamlit", "run", "monitoring/dashboard.py", "--server.address=0.0.0.0", "--server.port=8502", "--server.headless=true"]
    ports:
      - "127.0.0.1:${MONITORING_PORT:-8502}:8502"
    volumes:
      - app_logs:/app/app_logging/logs:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8502/_stcore/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  evaluation:
    <<: *app
    profiles: [evaluation]
    image: ai-document-insight-evaluation:local
    build:
      context: .
      target: evaluation
    # The notebook, dataset, judge prompt and saved outputs remain editable locally.
    volumes:
      - document_data:/app/data
      - ./evaluation:/app/evaluation
    ports:
      - "127.0.0.1:${JUPYTER_PORT:-8888}:8888"
    depends_on:
      setup:
        condition: service_completed_successfully

volumes:
  document_data:
  app_logs:
  ollama_models:
